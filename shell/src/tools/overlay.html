<!doctype html>
<html lang="zh-CN">
  <head>
    <meta charset="utf-8" />
    <meta http-equiv="Content-Security-Policy" content="default-src 'self'; script-src 'self'; style-src 'unsafe-inline'" />
    <title>框选一块屏幕</title>
    <style>
      html,
      body {
        margin: 0;
        padding: 0;
        width: 100%;
        height: 100%;
        overflow: hidden;
        background: transparent;
        cursor: crosshair;
        user-select: none;
        -webkit-user-select: none;
        font: 13px/1.5 "Microsoft YaHei", system-ui, sans-serif;
      }
      /* 框外用超大 box-shadow 压暗，框内保持 100% 透明 —— 所见即所截 */
      #rect {
        position: fixed;
        left: 0;
        top: 0;
        width: 0;
        height: 0;
        display: none;
        border: 1px solid #9db4ff;
        background: rgba(124, 92, 255, 0.06);
        box-shadow: 0 0 0 100vmax rgba(8, 10, 20, 0.34);
        box-sizing: border-box;
      }
      #rect.on {
        display: block;
      }
      #size {
        position: fixed;
        padding: 1px 6px;
        border-radius: 4px;
        background: rgba(8, 10, 20, 0.72);
        color: #eaf0ff;
        font-size: 11px;
        display: none;
        pointer-events: none;
        white-space: nowrap;
      }
      #size.on {
        display: block;
      }
      #hint {
        position: fixed;
        left: 50%;
        top: 18px;
        transform: translateX(-50%);
        padding: 8px 14px;
        border-radius: 10px;
        background: rgba(8, 10, 20, 0.62);
        color: #eaf0ff;
        font-size: 12.5px;
        letter-spacing: 0.3px;
        pointer-events: none;
      }
      #hint b {
        color: #b9c8ff;
        font-weight: 600;
      }
    </style>
  </head>
  <body>
    <div id="hint">拖出一个矩形框住要看的东西 · <b>Esc</b> 或右键取消</div>
    <div id="rect"></div>
    <div id="size"></div>
    <script src="overlay.js"></script>
  </body>
</html>
